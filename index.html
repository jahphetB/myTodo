<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>My Todo</title><script defer="defer" src="main.js"></script></head><body><header class="app-header"><div><h1>Organized!</h1><p>Your simple project and todo manager</p></div></header><main class="app-layout"><aside class="sidebar"><section class="panel"><h2>Create Project</h2><form id="project-form"><input id="project-name" placeholder="Project name" required/> <button type="submit">Add Project</button></form></section><section class="panel"><h2>Create Todo</h2><form id="todo-form"><input id="todo-title" placeholder="Title" required/> <input id="todo-description" placeholder="Description" required/> <input id="todo-due-date" type="date" required/> <select id="todo-priority"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select> <select id="todo-project"></select> <button type="submit">Add Todo</button></form></section></aside><section class="content"><h2>Projects</h2><div id="projects"></div></section></main></body></html>
